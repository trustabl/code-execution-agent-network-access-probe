name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin files are valid and the plugin skill matches the package skill
        run: |
          node -e "for (const f of ['plugin/.claude-plugin/plugin.json', 'plugin/.cursor-plugin/plugin.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
          cmp skills/code-execution-agent-network-access-probe/SKILL.md plugin/skills/code-execution-agent-network-access-probe/SKILL.md
          test -f plugin/assets/logo.png
      - run: docker build -t sandbox .
      # The agent pattern: a script in the sandbox scans mounted tool code and prints a summary.
      - name: Scan the fixture inside the sandbox
        run: |
          cat > scan.mjs <<'EOF'
          import { scan, summarize } from "@trustabl/code-execution-agent-network-access-probe";
          const s = summarize(await scan("/workspace/test/fixture", { sandbox: "off" }));
          console.log(JSON.stringify(s));
          if (!s.allowList.some((h) => h.startsWith("api.example.com"))) process.exit(1);
          EOF
          docker run --rm -v "$PWD:/workspace" sandbox node scan.mjs
